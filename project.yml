name: PullPathAR
options:
  bundleIdPrefix: com.operatorx
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic

targets:
  PullPathAR:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PullPathAR
    settings:
      base:
        INFOPLIST_FILE: PullPathAR/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.operatorx.pullpathar
        PRODUCT_NAME: PullPathAR
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 2
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
  PullPathARTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PullPathARTests
    dependencies:
      - target: PullPathAR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.operatorx.pullpathar.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  PullPathAR:
    build:
      targets:
        PullPathAR: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: PullPathARTests
