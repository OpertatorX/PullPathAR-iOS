name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project PullPathAR.xcodeproj \
            -scheme PullPathAR \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log

      - name: Select available iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); devices=[x for arr in d["devices"].values() for x in arr if x.get("isAvailable") and x["name"].startswith("iPhone")]; print(devices[0]["udid"] if devices else "")')
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found"
            exit 1
          fi
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Using simulator $UDID"

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project PullPathAR.xcodeproj \
            -scheme PullPathAR \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            test | tee test.log

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-diagnostics
          path: |
            build.log
            test.log
          if-no-files-found: ignore
